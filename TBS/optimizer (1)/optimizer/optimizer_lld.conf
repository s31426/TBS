# Zabbix agent2 active LLD: monitoring.json is parsed on the monitored host.
# Keep monitoring.json manually maintained; the generator only creates monitoring.json.example.
UserParameter=optimizer.lld[*],/etc/zabbix/optimizer_lld.py "$1"

# Ping: use existing host UserParameter, e.g.:
#   UserParameter=local.ping[*],fping -q $2 2>&1 && echo 1 || echo 0
# Template key: local.ping[{#GROUP_NAME},{#IP}]  ($1=name, $2=IP)
